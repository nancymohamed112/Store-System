<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store System</title>

    <style>
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .add { background-color: #28a745; }     
        .show { background-color: #007bff; }     
        .update { background-color: #ffc107;  } 
        .delete { background-color: #dc3545; }   

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2> Store System</h2>

    <input type="text" id="productInput" placeholder="Enter product name">

    <br><br>

    <button class="add" onclick="addProduct()">Add Product</button>
    <button class="show" onclick="showProducts()">Show Products</button>
    <button class="update" onclick="updateProduct()">Update Product</button>
    <button class="delete" onclick="deleteProduct()">Delete Product</button>

    <ul id="productList"></ul>

    <script src="./js/script.js"></script>

</body>
</html>
